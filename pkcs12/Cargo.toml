[package]
name = "pkcs12"
version = "0.2.0-pre.0"
description = """
Pure Rust implementation of Public-Key Cryptography Standards (PKCS) #12:
Personal Information Exchange Syntax v1.1 (RFC7292)
"""
authors = ["RustCrypto Developers"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/RustCrypto/formats/tree/master/pkcs12"
repository = "https://github.com/RustCrypto/formats"
categories = ["cryptography", "encoding", "no-std", "parser-implementations"]
keywords = ["crypto", "key", "pkcs", "private"]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[dependencies]
der = { version = "0.8", features = ["alloc", "derive", "oid"], default-features = false }
spki = { version = "0.8", default-features = false }
x509-cert = { version = "0.3.0-rc.4", default-features = false }
const-oid = { version = "0.10", features = ["db"], default-features = false }
cms = { version = "=0.3.0-pre.2", default-features = false }

# optional dependencies
cbc       = { version = "0.2", optional = true, default-features = false, features = ["alloc", "block-padding"] }
des       = { version = "0.9", optional = true, default-features = false }
digest    = { version = "0.11", features = ["alloc"], optional = true }
hmac      = { version = "0.13", optional = true }
pkcs5     = { version = "0.8.0-rc.13", features = ["pbes2", "alloc"], optional = true }
pkcs8     = { version = "0.11.0-rc.10", features = ["alloc", "pkcs5"], default-features = false, optional = true }
rand_core = { version = "0.10", optional = true, default-features = false }
sha1      = { version = "0.11", optional = true, default-features = false }
sha2      = { version = "0.11", optional = true, default-features = false }
zeroize   = { version = "1.8.1", optional = true, default-features = false }

[dev-dependencies]
hex-literal = "1"
pkcs8 = { version = "0.11.0-rc.10", features = ["pkcs5"] }
pkcs5 = { version = "0.8.0-rc.13", features = ["pbes2", "3des"] }
rand = "0.10"
sha2 = "0.11"
whirlpool = "0.11"

[features]
default = ["pem"]
builder = ["dep:hmac", "dep:pkcs5", "dep:pkcs8", "dep:rand_core", "dep:sha2", "kdf"]
# `parser` supports PBES2 (AES) bag encryption and HMAC-SHA-1/SHA-256 MACs.
# For legacy PFX files that use PKCS#12 PBE (3DES) bag encryption or
# PBKDF2/HMAC-SHA1 key derivation, also enable `sha1-insecure`.
parser = ["dep:cbc", "dep:des", "dep:hmac", "dep:pkcs5", "dep:pkcs8", "dep:sha1", "dep:sha2", "kdf"]
# Enables HMAC-SHA1 as the PBKDF2 PRF (via pkcs5) for parsing PBES2-encrypted
# bags that use the legacy SHA-1 PRF (common in older OpenSSL, Java, macOS).
# Named to match the upstream pkcs5 feature so users can audit what they enable.
sha1-insecure = ["parser", "pkcs5/sha1-insecure"]
kdf = ["dep:digest", "zeroize/alloc"]
pem = ["der/pem", "x509-cert/pem"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
